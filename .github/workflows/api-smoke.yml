name: Public API verification
on:
  push:
    branches: [main]
    paths: ["api/**", "mcp/**", ".github/workflows/api-smoke.yml"]
  workflow_dispatch:
  schedule:
    - cron: '21 9,21 * * *' # Two low-frequency public smoke checks per day (UTC).
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api/requirements.txt pytest httpx
      - run: python -m pytest api/test_app.py -q
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mcp/requirements.txt
      - run: python mcp/test_client.py
      - run: python mcp/test_remote_security.py
      - run: python mcp/test_remote_integration.py
  remote:
    needs: local
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed preview
        run: |
          set -eu
          python - <<'PY'
          import json, urllib.request, hashlib, time
          base="https://academia-singularidade-aun.onrender.com"
          def req(path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(base+path,data=data,headers={"Content-Type":"application/json"} if data else {})
              with urllib.request.urlopen(r,timeout=35) as response:
                  assert response.status==200
                  return json.load(response)
          for attempt in range(5):
              try:
                  assert req("/healthz")["status"]=="ok"
                  break
              except Exception:
                  if attempt==4: raise
                  time.sleep(15)
          assert {x["name"] for x in req("/v1/tools")["tools"]}=={"hash","json"}
          result=req("/v1/verify/hash",{"document":"abc"})
          assert result["digest"]==hashlib.sha256(b"abc").hexdigest()
          assert req("/v1/verify/json",{"document":'{"x":true}'})["valid"] is True
          assert req("/v1/verify/json",{"document":'{"x":1,"x":2}'})["valid"] is False
          assert req("/v1/verify/json",{"document":"1e9999"})["valid"] is False
          for attempt in range(8):
              try:
                  beacon=req("/.well-known/agent-utility-network.json")
                  assert beacon["status"]=="public-preview"
                  assert beacon["transports"]=={"rest":True,"mcp_remote":False,"a2a":False}
                  assert {t["name"] for t in beacon["tools"]}=={"hash","json"}
                  break
              except Exception:
                  if attempt==7: raise
                  time.sleep(12)
          print("Public HTTP verification and capability discovery passed.")
          PY

  report:
    # Readable status and run ID without repository write permissions or log leaks.
    if: always()
    needs: [local, mcp, remote]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Publish latest CI status to issue 1
        uses: actions/github-script@v7
        env:
          LOCAL_RESULT: ${{ needs.local.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          REMOTE_RESULT: ${{ needs.remote.result }}
        with:
          script: |
            const repo = context.repo;
            const run = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '# AUN verification health',
              '',
              `**Latest run:** [${context.runId}](${run})`,
              `**Commit:** \`${context.sha}\``,
              `**Updated:** ${new Date().toISOString()}`,
              '',
              '| Check | Result |',
              '|---|---|',
              `| Local REST tests | ${process.env.LOCAL_RESULT} |`,
              `| MCP stdio + HTTP integration | ${process.env.MCP_RESULT} |`,
              `| Public HTTPS smoke test | ${process.env.REMOTE_RESULT} |`,
              '',
              'This report intentionally contains no request bodies, credentials or logs.',
              'Open the linked GitHub Actions run for detailed job diagnostics.',
            ].join('\n');
            await github.rest.issues.update({
              ...repo, issue_number: 1, body,
            });
